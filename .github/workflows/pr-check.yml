name: PR Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

# The default GITHUB_TOKEN is contents:read-only here, which makes the semantic-title action and the
# bundle-size comment fail with "Resource not accessible by integration". Grant the minimum they need.
permissions:
  contents: read
  pull-requests: write

jobs:
  validate-pr:
    name: Validate PR
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            test
            docs
            chore
            perf
            ci
          requireScope: false

      - name: Check for secrets in diff
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --debug --only-verified

  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Check formatting
        run: dotnet format backend/Saha.sln --verify-no-changes --severity warn

  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      # Non-blocking: the codebase predates Prettier enforcement (~69 files need formatting).
      # Surfaces drift without failing the PR; run `npm run format` to normalise, then make this
      # blocking in a dedicated formatting PR.
      - name: Prettier check
        run: npm run format:check
        continue-on-error: true

      - name: TypeScript check
        run: npm run type-check

  size-check:
    name: Bundle Size Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: https://api.saha.app/api/v1

      - name: Report bundle size
        uses: preactjs/compressed-size-action@v2
        with:
          repo-token: '${{ secrets.GITHUB_TOKEN }}'
          # package.json lives in frontend/, not the repo root — run install/build there and glob
          # the bundle relative to it.
          cwd: ./frontend
          pattern: './dist/**/*.{js,css}'
          strip-hash: '\.[a-f0-9]{8}\.'
